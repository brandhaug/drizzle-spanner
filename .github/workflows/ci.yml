name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # .github/tested-versions.json is the single source of truth for the
  # runtime and drizzle-orm matrices; the README table is generated from the
  # same file (scripts/sync-tested-versions.ts, checked in the check job).
  versions:
    name: Read tested versions
    runs-on: ubuntu-latest
    outputs:
      drizzle-orm: ${{ steps.read.outputs.drizzle-orm }}
      node: ${{ steps.read.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          echo "drizzle-orm=$(jq -c '."drizzle-orm"' .github/tested-versions.json)" >> "$GITHUB_OUTPUT"
          echo "node=$(jq -c '.node' .github/tested-versions.json)" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun test tests/unit packages/drizzle-spanner-kit/tests/unit
      - run: bun run build
      - run: bun run --cwd packages/drizzle-spanner-kit build
      - name: README tested-versions table is in sync
        run: bun scripts/sync-tested-versions.ts --check

  package-hygiene:
    name: Types resolution and pack contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run --cwd packages/drizzle-spanner-kit build
      - run: bun run check:types
      - run: bun run check:pack
      - name: Dry-run publish drizzle-spanner
        run: npm publish --dry-run
      - name: Dry-run publish drizzle-spanner-kit
        run: npm publish --dry-run
        working-directory: packages/drizzle-spanner-kit

  # Node LTS set crossed with every supported drizzle-orm beta: a breaking
  # beta must fail here, not in a user application.
  integration-node:
    name: Integration (Node ${{ matrix.node }}, drizzle-orm ${{ matrix.drizzle-orm }})
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.versions.outputs.node) }}
        drizzle-orm: ${{ fromJSON(needs.versions.outputs.drizzle-orm) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm install --no-save drizzle-orm@${{ matrix.drizzle-orm }}
      - run: npm test
      - run: npm run test:integration

  examples:
    name: Examples (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [basic-crud, interleaved-rqb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Root install only provides workspace builds; no root lockfile anymore.
      - run: npm install
      - run: npm run build
      - run: npm run build -w drizzle-spanner-kit
      - name: Start Spanner emulator
        run: |
          docker run -d --name spanner-emulator -p 9010:9010 \
            gcr.io/cloud-spanner-emulator/emulator:latest
          until docker logs spanner-emulator 2>&1 | grep -qi 'gRPC server listening'; do sleep 1; done
      - run: npm ci
        working-directory: examples/${{ matrix.example }}
      - run: npm start
        working-directory: examples/${{ matrix.example }}
        env:
          SPANNER_EMULATOR_HOST: localhost:9010

  integration-bun:
    name: Integration (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Bun cannot manage the testcontainers lifecycle per file in one
      # process, so start one shared emulator for the whole run.
      - name: Start Spanner emulator
        run: |
          docker run -d --name spanner-emulator -p 9010:9010 \
            gcr.io/cloud-spanner-emulator/emulator:latest
          until docker logs spanner-emulator 2>&1 | grep -qi 'gRPC server listening'; do sleep 1; done
      - run: bun run test:integration:bun
        env:
          SPANNER_EMULATOR_HOST: localhost:9010

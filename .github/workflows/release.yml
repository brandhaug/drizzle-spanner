name: Release (dry run)

# Pushing a v<version> tag builds, tests, and DRY-RUN publishes both
# packages. Nothing is published to npm from CI: the final `npm publish` is a
# deliberate manual step, documented in RELEASING.md, so no npm token lives
# in this repository.

on:
  push:
    tags: ['v*']

jobs:
  release-dry-run:
    name: Build, test, pack, dry-run publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Tag matches both package versions and changelogs
        run: node scripts/release-check.ts "${GITHUB_REF_NAME}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build -w drizzle-spanner-kit
      - run: npm run check:types
      - run: npm run check:pack
      - name: Dry-run publish drizzle-spanner
        run: npm publish --dry-run
      - name: Dry-run publish drizzle-spanner-kit
        run: npm publish --dry-run
        working-directory: packages/drizzle-spanner-kit

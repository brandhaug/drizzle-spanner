name: Release (dry run)

# Pushing a v<version> tag builds, tests, and DRY-RUN publishes both
# packages. Nothing is published to npm from CI: the final `npm publish` is a
# deliberate manual step, documented in RELEASING.md, so no npm token lives
# in this repository.

on:
  push:
    tags: ['v*']

jobs:
  release-dry-run:
    name: Build, test, pack, dry-run publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Tag matches both package versions and changelogs
        run: bun scripts/release-check.ts "${GITHUB_REF_NAME}"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # Refresh the file: snapshot of drizzle-spanner now that dist/ exists.
      - run: bun install
      - run: bun run --cwd packages/drizzle-spanner-kit build
      - run: npm run check:types
      - run: npm run check:pack
      - name: Dry-run publish drizzle-spanner
        run: npm publish --dry-run
      - name: Dry-run publish drizzle-spanner-kit
        run: npm publish --dry-run
        working-directory: packages/drizzle-spanner-kit
